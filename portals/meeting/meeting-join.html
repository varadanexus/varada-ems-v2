<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Join Meeting — Varada Nexus</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html{min-height:100%;background:#040508}
    body{min-height:100vh;min-height:100dvh;margin:0;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left));background:radial-gradient(circle at 78% 12%,rgba(195,154,68,.12),transparent 30%),linear-gradient(145deg,#050609,#07080d 55%,#040508);overscroll-behavior-y:none}
    .share-card{width:min(620px,100%);margin:0;padding:clamp(30px,5vw,48px);border:1px solid rgba(230,200,126,.22);border-radius:22px;background:linear-gradient(155deg,rgba(230,200,126,.065),rgba(5,6,9,.96) 46%);box-shadow:0 28px 90px rgba(0,0,0,.58);color:#f7f4ec}
    .share-brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}.share-brand img{width:54px;height:54px;object-fit:contain}.share-brand strong{display:block;letter-spacing:.15em;text-transform:uppercase}.share-brand span{display:block;margin-top:4px;color:#9b9788;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase}
    .meeting-chip{display:inline-flex;padding:.35rem .72rem;border:1px solid rgba(230,200,126,.34);border-radius:999px;background:rgba(230,200,126,.09);color:#e6c87e;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    h1{margin:.8rem 0 .35rem;font-family:"Playfair Display",Georgia,serif;font-size:clamp(2rem,6vw,2.8rem)}
    .meeting-meta{margin:0 0 1.5rem;color:#b9b5a8;line-height:1.65;overflow-wrap:anywhere}.meeting-note{margin:0 0 1.3rem;padding:.85rem 1rem;border:1px solid rgba(230,200,126,.15);border-radius:12px;background:rgba(230,200,126,.035);color:#aaa698;line-height:1.55;overflow-wrap:anywhere}
    .join-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.join-field{display:grid;gap:7px;min-width:0}.join-field:first-child,.join-btn{grid-column:1/-1}.join-field label{color:#d6d1c2;font-size:.82rem;font-weight:700}.required{color:#e6c87e}.join-field input{width:100%;height:56px;padding:0 16px;border:1px solid rgba(230,200,126,.24);border-radius:12px;background:#0a0a0d;color:#f7f4ec;font:600 16px Manrope,Arial,sans-serif;appearance:none}.join-field input:focus{outline:none;border-color:#e6c87e;box-shadow:0 0 0 3px rgba(230,200,126,.1)}
    .join-btn{width:100%;min-height:56px;margin-top:8px;padding:0 20px;border:1px solid #e6c87e;border-radius:99px;background:linear-gradient(120deg,#f7e7b0,#e0c274 45%,#c39a44);color:#0a0805;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;touch-action:manipulation}.join-btn:disabled{cursor:not-allowed;opacity:.58}
    .join-status{min-height:24px;margin-top:12px;color:#aaa698;font-size:.84rem;line-height:1.5;text-align:center}.join-status.error{color:#e68f83}.join-status.success{color:#e6c87e}
    .privacy{margin:18px 0 0;color:#817e74;font-size:.76rem;line-height:1.55;text-align:center}
    @media(max-width:700px){body{place-items:start center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));overflow-y:auto}.share-card{padding:28px 20px;border-radius:18px}.share-brand{margin-bottom:20px}.share-brand img{width:46px;height:46px}.share-brand strong{font-size:.9rem}.share-brand span{font-size:.62rem}h1{font-size:clamp(1.8rem,9vw,2.35rem);line-height:1.08}.meeting-meta{font-size:.9rem}.join-form{grid-template-columns:1fr}.join-field:first-child,.join-btn{grid-column:auto}.join-btn{position:sticky;bottom:max(8px,env(safe-area-inset-bottom))}.privacy{text-align:left}}
    @media(min-width:701px) and (max-width:1024px){.share-card{width:min(680px,100%);padding:42px}}
    @media(max-height:620px) and (orientation:landscape){body{place-items:start center;padding-block:12px}.share-card{padding:22px 28px}.share-brand{margin-bottom:12px}.share-brand img{width:40px;height:40px}h1{margin:.45rem 0 .2rem;font-size:1.8rem}.meeting-meta{margin-bottom:.8rem}.meeting-note{margin-bottom:.8rem;padding:.65rem .8rem}.join-field input{height:48px}.join-btn{min-height:48px}.privacy{margin-top:10px}}
  </style>
</head>
<body>
  <main class="share-card">
    <div class="share-brand"><img src="/images/logo.png" alt="Varada Nexus"><div><strong>Varada Nexus</strong><span>Private Limited</span></div></div>
    <div id="meetingContent">
      <span class="meeting-chip">Meeting Link</span>
      <h1>Loading meeting…</h1>
      <p class="meeting-meta">Please wait while we validate this meeting link.</p>
    </div>
    <form id="joinForm" class="join-form" hidden>
      <div class="join-field"><label for="guestName">Full Name <span class="required">*</span></label><input id="guestName" name="name" type="text" maxlength="120" autocomplete="name" required placeholder="Enter your full name"></div>
      <div class="join-field"><label for="guestCompany">Company / Organization</label><input id="guestCompany" name="companyName" type="text" maxlength="160" autocomplete="organization" placeholder="Optional"></div>
      <div class="join-field"><label for="guestDesignation">Designation</label><input id="guestDesignation" name="designation" type="text" maxlength="160" autocomplete="organization-title" placeholder="Optional"></div>
      <button id="joinButton" class="join-btn" type="submit">Enter Waiting Room</button>
    </form>
    <div id="joinStatus" class="join-status" aria-live="polite"></div>
    <p class="privacy">No OTP is required for this meeting. You will remain in the waiting room until the host or administrator starts the video conference.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/new-ems/config/runtime.js?v=meeting-shared-link-2"></script>
  <script type="module">
    import { getSupabaseClient } from "/new-ems/config/supabase.js";

    const joinToken = new URLSearchParams(window.location.search).get("j") || "";
    const content = document.getElementById("meetingContent");
    const form = document.getElementById("joinForm");
    const button = document.getElementById("joinButton");
    const status = document.getElementById("joinStatus");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function fmt(value) {
      if (!value) return "Schedule to be confirmed";
      try { return new Date(value).toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }); }
      catch { return String(value); }
    }
    function setStatus(message, type = "") {
      status.textContent = message;
      status.className = `join-status ${type}`.trim();
    }
    async function functionMessage(error) {
      const context = error?.context;
      if (context && typeof context.json === "function") {
        const payload = await context.json().catch(() => null);
        if (payload?.error) return payload.error;
      }
      return error?.message || "The meeting service is temporarily unavailable.";
    }
    async function invoke(action, payload = {}) {
      const { data, error } = await getSupabaseClient().functions.invoke("meetings-integrations", { body: { action, ...payload } });
      if (error) throw new Error(await functionMessage(error));
      if (data?.error) throw new Error(data.error);
      return data;
    }

    async function loadMeeting() {
      if (!joinToken) throw new Error("This meeting link is incomplete.");
      const result = await invoke("get_shared_meeting", { joinToken });
      const meeting = result.meeting || {};
      content.innerHTML = `
        <span class="meeting-chip">Waiting-Room Access</span>
        <h1>${escapeHtml(meeting.title || "Meeting")}</h1>
        <p class="meeting-meta">${escapeHtml(fmt(meeting.scheduledAt || meeting.scheduledLocal))}${meeting.hostName ? ` · Hosted by ${escapeHtml(meeting.hostName)}` : ""}</p>
        ${meeting.lobbyNote ? `<div class="meeting-note">${escapeHtml(meeting.lobbyNote)}</div>` : ""}
      `;
      form.hidden = false;
      if (window.matchMedia("(pointer:fine)").matches) document.getElementById("guestName").focus();
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const values = new FormData(form);
      const name = String(values.get("name") || "").trim();
      if (name.length < 2) {
        setStatus("Enter your full name to continue.", "error");
        document.getElementById("guestName").focus();
        return;
      }
      button.disabled = true;
      button.textContent = "Entering Waiting Room…";
      setStatus("Registering your waiting-room entry…");
      try {
        const result = await invoke("register_shared_guest", {
          joinToken,
          name,
          companyName: values.get("companyName"),
          designation: values.get("designation")
        });
        setStatus("Entry registered. Opening the waiting room…", "success");
        window.location.href = `/new-ems/modules/meetings-waiting/index.html?t=${encodeURIComponent(result.inviteToken)}`;
      } catch (error) {
        setStatus(error.message, "error");
        button.disabled = false;
        button.textContent = "Enter Waiting Room";
      }
    });

    loadMeeting().catch((error) => {
      content.innerHTML = `<span class="meeting-chip">Link Unavailable</span><h1>Unable to join</h1><p class="meeting-meta">${escapeHtml(error.message)}</p>`;
      setStatus("");
    });
  </script>
</body>
</html>
