name: Deploy Beta EMS To GitHub Pages

on:
  push:
    branches:
      - release/2.0-rc1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate deploy inputs
        run: |
          npm run check:pwa
          npm run check:migrations

      - name: Build Nexus Social
        env:
          NEXT_PUBLIC_BASE_PATH: /social-media
          NEXT_PUBLIC_SUPABASE_URL: https://ftejxcycoiagbslnzaab.supabase.co
          NEXT_PUBLIC_EMS_PARENT_ORIGINS: https://www.varadanexus.com,https://varadanexus.com,https://localhost
        run: |
          npm ci --prefix varada-social
          npm run social:build

      - name: Prepare Pages bundle
        shell: bash
        run: |
          rm -rf .pages-dist
          mkdir -p .pages-dist
          # Public website pages live at the repo root (clean URLs: /founder, /services, ...)
          cp ./*.html .pages-dist/
          cp robots.txt .pages-dist/robots.txt
          cp sitemap.xml .pages-dist/sitemap.xml
          cp -R assets .pages-dist/assets
          cp -R images .pages-dist/images
          cp -R portals .pages-dist/portals
          cp -R blog .pages-dist/blog
          cp -R professional-tools .pages-dist/professional-tools
          cp -R whatsapp-platform .pages-dist/whatsapp-platform
          cp favicon.ico .pages-dist/favicon.ico
          cp sw.js .pages-dist/sw.js
          cp -R new-ems/. .pages-dist/new-ems/
          # Publish runtime assets only. Internal architecture, database and
          # server implementation files must never be part of the public site.
          rm -rf .pages-dist/new-ems/docs
          rm -rf .pages-dist/new-ems/supabase
          rm -rf .pages-dist/new-ems/output
          rm -rf .pages-dist/new-ems/tmp
          rm -f .pages-dist/new-ems/system-schema-dump.sql
          cp CNAME .pages-dist/CNAME
          npm --prefix varada-social run export:pages -- "$GITHUB_WORKSPACE/.pages-dist"

      - name: Verify Pages bundle
        shell: bash
        run: |
          test -f .pages-dist/sw.js
          test -f .pages-dist/new-ems/manifest.webmanifest
          test -f .pages-dist/new-ems/index.html
          test -f .pages-dist/social-media/dashboard/index.html
          test -f .pages-dist/social-media/accounts/index.html
          test -f .pages-dist/social-media/campaigns/index.html
          test -f .pages-dist/whatsapp-platform/features/index.html
          test -f .pages-dist/whatsapp-platform/solutions/index.html
          test -f .pages-dist/whatsapp-platform/pricing/index.html
          test -f .pages-dist/whatsapp-platform/access/index.html
          test ! -e .pages-dist/new-ems/docs
          test ! -e .pages-dist/new-ems/supabase
          test ! -e .pages-dist/new-ems/system-schema-dump.sql

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload EMS beta artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./.pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
