<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Varada Nexus Connect</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #08100d; color: #e9f5ef; font: 16px system-ui, sans-serif; }
      main { text-align: center; padding: 2rem; }
      p { color: #a7bbb1; }
    </style>
  </head>
  <body>
    <main>
      <strong>Varada Nexus Connect</strong>
      <p>Completing Google Contacts connection…</p>
    </main>
    <script>
      // Keep the public OAuth redirect branded while the existing Edge Function
      // completes the server-side code exchange. The fixed destination prevents
      // an attacker from turning this callback into an open redirect.
      const supabaseCallback = 'https://ftejxcycoiagbslnzaab.supabase.co/functions/v1/whatsapp-platform-messaging';
      const params = new URLSearchParams(window.location.search);
      params.set('google_contacts_callback', '1');
      window.location.replace(`${supabaseCallback}?${params.toString()}`);
    </script>
  </body>
</html>
